<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAFIA — Evaluación de proyecto (informe)</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 120'%3E%3Cpath d='M 50 8 Q 12 50 12 80 Q 12 110 50 110 Q 88 110 88 80 Q 88 50 50 8 Z' fill='%2322A93A'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0F3D14">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="safia-theme.css">
  <style>
    body{background:#E9EBEE;}
    .barra{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
    .barra .field{display:flex;flex-direction:column;gap:3px;min-width:160px;}
    .barra label{font-size:11px;font-weight:600;color:var(--label);text-transform:uppercase;letter-spacing:.06em;}
    .barra select,.barra input{font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--bd);border-radius:7px;background:#fff;}
    .barra .chk{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;align-items:center;}
    .barra .chk label{text-transform:none;letter-spacing:0;font-weight:500;color:var(--body);display:flex;gap:5px;align-items:center;cursor:pointer;font-size:12px;}
    .hoja{background:#fff;max-width:210mm;margin:18px auto;padding:16mm 16mm 14mm;box-shadow:0 2px 12px rgba(0,0,0,.08);color:#2E3236;font-size:12.5px;line-height:1.45;}
    .hoja h1{font-size:22px;font-weight:800;color:#0F3D14;margin:0;}
    .hoja h2{font-size:15px;font-weight:800;color:#0F3D14;border-bottom:2px solid #22A93A;padding-bottom:4px;margin:22px 0 10px;}
    .hoja h3{font-size:13px;font-weight:700;margin:12px 0 6px;color:#2E3236;}
    .hoja .tbl{width:100%;border-collapse:collapse;font-size:11.5px;table-layout:auto;}
    /* el tema pone nowrap en las celdas (para pantalla con scroll); en la hoja todo tiene que cortar línea */
    .hoja table.tbl tbody td,.hoja table.tbl thead th,.hoja .tbl td,.hoja .tbl th{white-space:normal !important;word-wrap:normal;overflow-wrap:break-word;word-break:keep-all;hyphens:none;padding:5px 7px !important;vertical-align:top !important;}
    .hoja table.tbl thead th{background:#F2F3F5 !important;color:#41464B !important;font-size:10px !important;}
    .hoja table.tbl{font-size:11.5px !important;}
    .hoja .stat{min-width:auto !important;}
    .hoja .badge,.hoja .tbl span[style*="border-radius"]{white-space:nowrap;}
    .hoja .kpis{grid-template-columns:repeat(4,minmax(0,1fr));}
    .hoja .dos{grid-template-columns:repeat(2,minmax(0,1fr));}
    .hoja *{max-width:100%;}
    .hoja .tablewrap,.hoja .tablescroll{overflow:visible !important;width:100%;}
    .hoja .tbl th:first-child,.hoja .tbl td:first-child{width:22%;}
    .hoja img,.hoja svg{max-width:100%;}
    .hoja .tbl th{background:#F2F3F5;color:#41464B;text-transform:uppercase;font-size:10px;letter-spacing:.05em;padding:6px 7px;text-align:left;border-bottom:1px solid var(--bd);}
    .hoja .tbl td{padding:5px 7px;border-bottom:1px solid #EEF0F2;vertical-align:top;}
    .hoja .tbl .r{text-align:right;} .hoja .tbl td.r{white-space:nowrap !important;} .hoja .tbl td.r .sub{white-space:normal !important;}
    .hoja .muted{color:#8C9196;}
    .hoja .sub{font-size:10.5px;color:#8C9196;}
    .hoja .note{border-left:3px solid var(--bd);background:#F7F8F9;padding:8px 11px;border-radius:6px;font-size:12px;margin:8px 0;}
    .hoja .note.ok{border-left-color:#22A93A;background:#E7F6EA;} .hoja .note.warn{border-left-color:#B8731A;background:#FBF1DF;} .hoja .note.info{border-left-color:#2E72C8;background:#E7F0FB;}
    .hoja .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 4px;}
    .hoja .kpi{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;}
    .hoja .kpi .sl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#8C9196;}
    .hoja .kpi .sv{font-size:18px;font-weight:800;color:#0F3D14;margin-top:2px;}
    .hoja .kpi .ss{font-size:10.5px;color:#8C9196;}
    .hoja .cab{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:3px solid #0F3D14;padding-bottom:10px;}
    .hoja .marca{display:flex;align-items:center;gap:10px;}
    .hoja .marca svg{width:34px;height:40px;}
    .hoja .marca .t1{font-size:17px;font-weight:800;letter-spacing:.06em;color:#0F3D14;line-height:1.1;}
    .hoja .marca .t2{font-size:9px;letter-spacing:.14em;color:#6B6356;}
    .hoja .cab .der{text-align:right;font-size:12px;color:#41464B;}
    .hoja .pie{margin-top:22px;border-top:1px solid var(--bd);padding-top:8px;font-size:10px;color:#8C9196;display:flex;justify-content:space-between;gap:12px;}
    .hoja img.sat{width:100%;max-width:340px;border-radius:8px;border:1px solid var(--bd);display:block;}
    .hoja .dos{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .hoja ol,.hoja ul{margin:6px 0 6px 18px;}
    /* Un bloque grande (diagnóstico de un cultivo, plan de la meta) puede ocupar más de una hoja: si se le prohíbe cortarse, el navegador
       lo manda entero a la hoja siguiente y deja una hoja EN BLANCO. Se deja cortar; lo que no se corta son los bloques chicos. */
    .hoja .seccion{break-inside:auto;}
    .hoja .seccion>h3,.hoja .card-h,.hoja h3{break-after:avoid;}
    .hoja .note,.hoja .kpis,.hoja .kpi,.hoja .statbar,.hoja .stat{break-inside:avoid;}
    .hoja .salto{break-before:page;}
    .hoja .stats{display:flex;gap:8px;flex-wrap:wrap;} .hoja .stat{border:1px solid var(--bd);border-radius:8px;padding:6px 10px;min-width:120px;}
    .hoja .stat .sl{font-size:10px;color:#8C9196;text-transform:uppercase;} .hoja .stat .sv{font-size:15px;font-weight:800;color:#0F3D14;} .hoja .stat .ss{font-size:10px;color:#8C9196;}
    .hoja .card{border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin:8px 0;} .hoja .card-h h3{margin:0 0 6px;}
    .hoja table.tbl td .num{font-weight:700;}
    .hoja .evo-mejor{color:#178029;font-weight:700;} .hoja .evo-peor{color:#C0392B;font-weight:700;}
    .hoja .interp{font-size:11px;}
    .cfgcard{background:#fff;border:1px solid var(--bd);border-radius:10px;max-width:210mm;margin:14px auto 0;padding:14px 16px;box-shadow:0 2px 12px rgba(0,0,0,.06);}
    .cfggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
    .cfggrid .field{display:flex;flex-direction:column;gap:3px;} .cfggrid label{font-size:11px;font-weight:600;color:var(--label);text-transform:uppercase;letter-spacing:.06em;} .cfggrid input[type=text]{font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--bd);border-radius:7px;}
    .hoja .marca img.logo{height:44px;max-width:220px;object-fit:contain;}
    .hoja .firma{margin-top:26px;display:flex;justify-content:flex-end;} .hoja .firma .bloque{text-align:center;min-width:220px;border-top:1px solid #2E3236;padding-top:6px;font-size:12px;} .hoja .firma img{max-height:64px;max-width:220px;display:block;margin:0 auto 4px;}

    /* agua en la hoja A4: diagrama y cultivos uno abajo del otro, sin cortar el diagrama de su título */
    .hoja .ca-grid{grid-template-columns:minmax(0,1fr) !important;}
    .hoja .ca-grid > div{break-inside:avoid;}
    .hoja .ca-grid svg{max-width:520px;}
    /* economía y "cómo llegar al líder" en la hoja A4 */
    .hoja .tablewrap{margin:4px 0;} .hoja .tablescroll{overflow:visible;}
    .hoja .eco-grid > div{min-width:0;}
    .hoja details > summary{list-style:none;font-weight:700;margin:6px 0;} .hoja details > summary::-webkit-details-marker{display:none;}
    @media print{ .cfgcard{display:none !important;} }
    .hoja .statbar{display:flex;gap:8px;flex-wrap:wrap;border:0;padding:0;margin:8px 0;} .hoja .statbar .stat{flex:1 1 120px;} .hoja .sv.green{color:#178029;} .hoja .sv.red{color:#B3261E;}
    .hoja .tbl th:first-child,.hoja .tbl td:first-child{width:auto;}
    .hoja .interp .tbl,.hoja .tbl-interp,.hoja .tbl-fijo{table-layout:fixed;}
    .hoja .tbl-interp th:nth-child(1),.hoja .tbl-interp td:nth-child(1){width:26%;}
    .hoja .tbl-interp th:nth-child(2),.hoja .tbl-interp td:nth-child(2){width:18%;}
    .hoja .tbl-interp th:nth-child(3),.hoja .tbl-interp td:nth-child(3){width:22%;}
    .hoja .tbl-interp th:nth-child(4),.hoja .tbl-interp td:nth-child(4){width:34%;}
    .hoja .tbl-interp tbody.interp-fila{break-inside:avoid;} .hoja .tbl-interp tr.interp-lectura td{width:auto;}
    .hoja .interp-foliar .tbl th:nth-child(1),.hoja .interp-foliar .tbl td:nth-child(1){width:13%;}
    .hoja .interp-foliar .tbl th:nth-child(2),.hoja .interp-foliar .tbl td:nth-child(2){width:9%;}
    .hoja .interp-foliar .tbl th:nth-child(3),.hoja .interp-foliar .tbl td:nth-child(3){width:14%;}
    .hoja .interp-foliar .tbl th:nth-child(4),.hoja .interp-foliar .tbl td:nth-child(4){width:15%;}
    .hoja .interp-foliar .tbl th:nth-child(5),.hoja .interp-foliar .tbl td:nth-child(5){width:15%;}
    .hoja .interp-foliar .tbl th:nth-child(6),.hoja .interp-foliar .tbl td:nth-child(6){width:34%;}
    @media print{
      @page{size:A4;margin:14mm 0 14mm;}
      body{background:#fff;} .barra{display:none !important;} .hoja{box-shadow:none;margin:0;padding:2mm 16mm 4mm;max-width:none;width:auto;}
      .hoja h2{break-after:avoid;} .hoja .tbl{break-inside:auto;} .hoja tr{break-inside:avoid;}
      #safiaOffline,#safiaInstalar,.toast{display:none !important;}
    }
  </style>
  <style>.hoja .stats .stat{flex:1 1 110px;} .hoja .interp-suelo .tbl{font-size:10.5px !important;}</style>
</head>
<body>
  <div class="barra no-print">
    <div class="field" style="min-width:320px;"><label>Evaluación (prospecto · proyecto · estrategia)</label><select id="selEval"></select></div>
    <div class="field"><label>Preparado por</label><input type="text" id="autor" placeholder="Ing. Agr. …" style="min-width:180px;"></div>
    <div class="chk" id="secciones">
      <label><input type="checkbox" data-s="resumen" checked> Resumen ejecutivo y veredicto</label>
      <label><input type="checkbox" data-s="pago" checked> Lo que gana el riego y cuánto tarda en pagar</label>
      <label><input type="checkbox" data-s="suelo" checked> Qué hacer en su campo (tierra vs los que más rinden)</label>
      <label><input type="checkbox" data-s="lider" checked> Cómo llegar al líder</label>
      <label><input type="checkbox" data-s="economia" checked> Economía completa</label>
      <label><input type="checkbox" data-s="potencial"> Potencial por cultivo (resumen, sin casos)</label>
      <label><input type="checkbox" data-s="clima" checked> Ubicación y clima</label>
      <label><input type="checkbox" data-s="agua" checked> Agua de riego</label>
      <label><input type="checkbox" data-s="zona" checked> La zona (promedio y el mejor)</label>
    </div>
    <button class="btn" id="btnActualizar" type="button">Actualizar</button>
    <button class="btn green" id="btnPdf" type="button">Guardar como PDF / Imprimir</button>
    <button class="btn" id="btnEnviar" type="button">Enviar al prospecto</button>
    <a class="btn" href="informe.html" title="El logo y la firma se configuran en el informe del cliente y valen para los dos">Logo y firma</a>
    <a class="btn" href="evaluar.html">Volver a Evaluar</a>
    <span class="muted" id="estado" style="font-size:12px;align-self:center;"></span>
  </div>
  <div class="cfgcard no-print" id="envInforme" style="display:none;">
    <h3 style="margin:0 0 6px;font-size:14px;">Enviar la evaluación</h3>
    <div class="muted" style="font-size:12px;" id="envEstado">Se publica una copia en la nube de SAFIA con un link privado válido 30 días.</div>
    <div id="envLink" style="margin:8px 0;font-size:13px;word-break:break-all;"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:8px;"><button class="btn" id="btnEnvCerrar" type="button">Cerrar</button><button class="btn" id="btnEnvCopiar" type="button" disabled>Copiar link</button><button class="btn" id="btnEnvCorreo" type="button" disabled>Correo</button><button class="btn green" id="btnEnvWhatsapp" type="button" disabled>WhatsApp</button></div>
  </div>
  <div class="hoja" id="hoja"><div class="muted" style="padding:40px;text-align:center;">Cargando la evaluación…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script src="safia-materiales.js"></script>

</body>
</html>
